autonomy: execute

filesystem:
  read:
    default: allow
    deny:
      - "**/.env"
      - "**/.env.*"
      - "**/.git/**"
      - "~/.ssh/**"
      - "~/.aws/**"
      - "~/.config/gcloud/**"
      - "~/.azure/**"
  write:
    default: ask
    allow:
      - "src/**"
      - "tests/**"
      - "crates/**"
      - "packages/**"
      - "python/**"
      - "jetbrains/**"
      - "docs/**"
      - "schemas/**"
      - "plugins/**"
      - "migrations/**"
      - "*.md"
      - "*.toml"
      - "*.json"
      - "*.yaml"
      - "*.yml"
    deny:
      - "**/.env"
      - "**/.env.*"
      - "**/.git/**"

process:
  default: ask
  allow:
    - "git status**"
    - "git diff**"
    - "git log**"
    - "cargo check**"
    - "cargo test**"
    - "cargo fmt**"
    - "cargo clippy**"
    - "pnpm test**"
    - "pnpm typecheck**"
    - "pnpm build**"
    - "npm test**"
    - "pytest**"
    - "ruff check**"
    - "mypy**"
  deny:
    - "sudo **"
    - "su **"
    - "ssh **"
    - "scp **"
    - "git push**"
    - "git remote set-url**"
    - "terraform apply**"
    - "tofu apply**"
    - "kubectl delete**"
    - "kubectl apply**"
    - "helm upgrade**"
    - "rm -rf /**"

network:
  default: ask
  allow:
    - "https://github.com/**"
    - "https://docs.github.com/**"
    - "https://crates.io/**"
    - "https://registry.npmjs.org/**"
    - "https://pypi.org/**"
    - "http://127.0.0.1/**"
    - "http://localhost/**"

mcp:
  default: ask

acp:
  default: ask

database_read:
  default: ask
  allow:
    - "local/**"
    - "dev/**"
database_write:
  default: ask
  deny:
    - "prod/**"
    - "production/**"

secrets:
  default: deny

cloud_read:
  default: ask
cloud_write:
  default: deny

deployment:
  default: deny

browser:
  default: ask
  allow:
    - "http://127.0.0.1/**"
    - "http://localhost/**"
    - "navigate"
    - "click"
    - "fill"
    - "text"
    - "screenshot"

git:
  default: ask
  allow:
    - "status**"
    - "diff**"
    - "log**"
    - "show**"
  deny:
    - "push**"
    - "remote**"
    - "config --global**"

delegation:
  default: ask
  allow:
    - "architect"
    - "researcher"
    - "backend-engineer"
    - "frontend-engineer"
    - "database-engineer"
    - "devops-engineer"
    - "debugger"
    - "tester"
    - "reviewer"
    - "security-reviewer"
    - "documentation-engineer"
