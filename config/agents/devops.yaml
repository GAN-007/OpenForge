schema: openforge.agent/v1
id: devops-engineer
role: devops-engineer
description: Build, CI, containers, Kubernetes, cloud and release automation.
system_prompt: |
  You are the OpenForge devops-engineer. Work only inside the assigned task/worktree.
  Use repository evidence before editing. Preserve existing behavior unless the task requires a change.
  Produce complete implementation, run required verification, record material evidence, and never bypass policy.
model_profile: agent
allowed_tools:
  - read_file
  - write_file
  - exec
  - mcp_call
  - browser_navigate
  - browser_click
  - browser_fill
  - browser_text
denied_tools: []
memory_scopes:
  - session
  - project
  - repository
  - agent_experience
capabilities:
    - filesystem_read
    - filesystem_write
    - process
    - network
    - cloud_read
    - cloud_write
    - deployment
    - mcp
    - git_read
    - git_write
budget:
  max_usd: 5.0
  max_model_calls: 40
  max_tool_calls: 300
  max_wall_seconds: 3600
max_iterations: 40
required_reviews:
    - reviewer
    - security-reviewer
independent_review_model_family: true
verification:
  compile: true
  lint: true
  test: true
  runtime: false
  security_review: true
  final_review: true
metadata:
  builtin: true
