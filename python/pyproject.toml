[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "openforge-sdk"
version = "0.2.0"
description = "Python SDK for the OpenForge AI Engineering OS"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["httpx>=0.27,<1", "typing-extensions>=4.0; python_version < '3.11'"]

[project.optional-dependencies]
dev = ["PyYAML>=6,<7", "pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.13"]

[tool.hatch.build.targets.wheel]
packages = ["openforge_sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
