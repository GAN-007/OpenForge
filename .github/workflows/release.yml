name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed release tag
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  validate:
    name: Release validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90.0"
          components: rustfmt,clippy
      - uses: pnpm/action-setup@v4
        with: { version: "10.15.1" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: cargo fmt --all --check
      - run: cargo check --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: python -m pip install -e "python[dev]"
      - run: ruff check python
      - run: mypy python/openforge_sdk
      - run: pytest python/tests
      - run: cargo run -p openforge-evals --release -- --suite evals/market-readiness.json --output target/evals/market-readiness.json

  desktop:
    name: Desktop ${{ matrix.platform }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, os: ubuntu-24.04, args: "" }
          - { platform: macos-arm64, os: macos-14, args: "--target aarch64-apple-darwin" }
          - { platform: macos-x64, os: macos-13, args: "--target x86_64-apple-darwin" }
          - { platform: windows-x64, os: windows-2025, args: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90.0"
          targets: ${{ matrix.platform == 'macos-arm64' && 'aarch64-apple-darwin' || matrix.platform == 'macos-x64' && 'x86_64-apple-darwin' || '' }}
      - uses: pnpm/action-setup@v4
        with: { version: "10.15.1" }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - name: Build signed desktop bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: packages/desktop
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: OpenForge ${{ github.event.inputs.tag || github.ref_name }}
          releaseDraft: true
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}
          args: ${{ matrix.args }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: packages/desktop/src-tauri/target/**/release/bundle/**/*

  sbom:
    name: SBOM and provenance
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: openforge.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: openforge-sbom
          path: openforge.spdx.json
      - uses: actions/attest-sbom@v2
        with:
          subject-path: Cargo.toml
          sbom-path: openforge.spdx.json
