name: Apply Ollama integration overlay

on:
  push:
    branches:
      - feat/ollama-production-integration
    paths:
      - scripts/apply_ollama_overlay.py

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python scripts/apply_ollama_overlay.py
      - run: git diff --check
      - name: Commit production overlay
        run: |
          git config user.name "openforge-integration-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete native Ollama production integration"
          git push origin HEAD:${GITHUB_REF_NAME}
