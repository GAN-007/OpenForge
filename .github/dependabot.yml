version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    groups:
      rust-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      javascript-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: "/python"
    schedule:
      interval: weekly

  - package-ecosystem: gradle
    directory: "/jetbrains"
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
