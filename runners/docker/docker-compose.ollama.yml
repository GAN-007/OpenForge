services:
  openforge-runner:
    build:
      context: ../..
      dockerfile: runners/docker/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
    volumes:
      - ../../:/workspace
    working_dir: /workspace
    stdin_open: true
    tty: true
