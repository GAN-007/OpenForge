apiVersion: batch/v1
kind: Job
metadata:
  name: openforge-runner
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 900
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          image: ghcr.io/gan-007/openforge-runner:latest
          workingDir: /workspace
          command: ["bash", "-lc", "sleep infinity"]
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "4"
              memory: "8Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      volumes:
        - name: workspace
          emptyDir:
            sizeLimit: 20Gi
